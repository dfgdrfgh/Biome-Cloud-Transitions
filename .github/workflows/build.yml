name: Build Forge 1.20.1
on:
  push:
    branches: [forge-1.20.1-port]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile, test and reobfuscate Forge mod
        run: bash gradlew --no-daemon test jarJar
      - name: Check release metadata and bundled runtime
        run: python3 tests/forge_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: Biome-Cloud-Transitions-Forge-1.20.1
          path: build/libs/biome-cloud-transitions-forge-1.20.1-1.0.1-forge.1.jar
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: Forge-test-results
          path: build/reports/tests/
          if-no-files-found: ignore
