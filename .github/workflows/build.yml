name: Build Biome Cloud Transitions

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Fabric 1.21.1 JAR
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Prepare Minecraft and Fabric dependencies
        run: python3 port/bootstrap.py
      - name: Compile standalone cloud mod
        run: python3 build.py
      - name: Prepare software OpenGL
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb libgl1-mesa-dri
      - name: Check palette and vanilla, Sodium and Cirrus renderers
        run: |
          python3 -m zipfile -t biome-cloud-transitions-fabric-1.21.1-1.0.0.jar
          python3 tests/cloud_blending.py
          python3 tests/cloud_rendering.py
      - name: Upload installable mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: Biome-Cloud-Transitions-Fabric-1.21.1
          path: biome-cloud-transitions-fabric-1.21.1-1.0.0.jar
          if-no-files-found: error
          retention-days: 30
      - name: Upload renderer logs if validation fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Cloud-renderer-test-logs
          path: test-cloud-rendering/*.log
          if-no-files-found: ignore
