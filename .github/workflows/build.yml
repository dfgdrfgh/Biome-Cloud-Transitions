name: Build Biome Cloud Transitions

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Fabric 1.21.1 JAR
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Prepare Minecraft and Fabric dependencies
        run: python3 port/bootstrap.py
      - name: Compile standalone cloud mod
        run: python3 build.py
      - name: Prepare software OpenGL
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb libgl1-mesa-dri
      - name: Check palette and vanilla, Sodium and Cirrus renderers
        run: |
          python3 -m zipfile -t biome-cloud-transitions-fabric-1.21.1-1.0.2.jar
          python3 tests/cloud_blending.py
          python3 tests/cloud_rendering.py
          python3 tests/legacy_wwoo_clouds.py
      - name: Upload installable mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: Biome-Cloud-Transitions-Fabric-1.21.1
          path: biome-cloud-transitions-fabric-1.21.1-1.0.2.jar
          if-no-files-found: error
          retention-days: 30
  
  client-smoke:
    name: Minecraft 1.21.1 Fabric client startup and world load
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Download exact release JAR
        uses: actions/download-artifact@v4
        with:
          name: Biome-Cloud-Transitions-Fabric-1.21.1
          path: run/mods
      - name: Ensure exactly one valid mod JAR is loaded
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t jars < <(find run/mods -maxdepth 1 -type f -name '*.jar' | sort)
          test "${#jars[@]}" -eq 1
          jar tf "${jars[0]}" >/dev/null
          sha256sum "${jars[0]}"
      - name: Install virtual-display rendering libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb libgl1-mesa-dri libglx-mesa0
      - name: Start Minecraft, load a singleplayer world, and check for crashes
        uses: headlesshq/mc-runtime-test@645691de43520240e1d1e45b4b9a4d9cd9c294a4 # v4.5.2
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        with:
          mc: '1.21.1'
          modloader: fabric
          regex: .*fabric.*
          mc-runtime-test: fabric
          java: '21'
          fabric-api: none
          fabric-gametest-api: none
          xvfb: true
          headlessmc-command: '--retries 3 --jvm -Djava.awt.headless=true -DMcRuntimeGameTest=false'
          cache-mc: github

